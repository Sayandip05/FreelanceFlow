# ============================================
# FreelanceFlow — docker-compose.yml
# ============================================
# Infrastructure:
#   • Elasticsearch 8.14 (Docker Container: port 9200)
#   • Redis: Upstash Cloud Managed Redis (via .env)
#   • PostgreSQL: Supabase Managed Cloud DB (via .env)
#
# ── Start Infrastructure (Elasticsearch) ──
#   docker compose up -d
#
# ── Start Full Stack (App profile) ──
#   docker compose --profile app up --build -d
# ============================================

services:

  # ──────────────────────────────────────────
  # Elasticsearch 8.14  (Search engine)
  # ──────────────────────────────────────────
  elastic:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.14.0
    container_name: freelanceflow_elasticsearch
    environment:
      - node.name=es-node-01
      - cluster.name=freelanceflow-cluster
      - discovery.type=single-node
      - xpack.security.enabled=false
      - xpack.security.enrollment.enabled=false
      - xpack.security.http.ssl.enabled=false
      - xpack.security.transport.ssl.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    ports:
      - "9200:9200"
    volumes:
      - elastic_data:/usr/share/elasticsearch/data
    networks:
      - freelanceflow_network
    restart: unless-stopped
    healthcheck:
      test:
        - "CMD-SHELL"
        - "curl -sf http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s || exit 1"
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 40s

  # ──────────────────────────────────────────
  # Django production server (Gunicorn)
  # ──────────────────────────────────────────
  web:
    build: .
    profiles: [app]
    container_name: freelanceflow_web
    ports:
      - "8000:8000"
    volumes:
      - media_data:/app/media
    env_file:
      - .env
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.production
      - PYTHONUNBUFFERED=1
      - ELASTICSEARCH_URL=http://elastic:9200
    networks:
      - freelanceflow_network
    depends_on:
      elastic:
        condition: service_started
    restart: unless-stopped
    stop_grace_period: 30s
    stop_signal: SIGTERM
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/live/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ──────────────────────────────────────────
  # Daphne  (WebSocket / ASGI server)
  # ──────────────────────────────────────────
  daphne:
    build: .
    profiles: [app]
    container_name: freelanceflow_daphne
    command: daphne -b 0.0.0.0 -p 8001 config.asgi:application
    ports:
      - "8001:8001"
    volumes:
      - media_data:/app/media
    env_file:
      - .env
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.production
      - PYTHONUNBUFFERED=1
      - ELASTICSEARCH_URL=http://elastic:9200
    networks:
      - freelanceflow_network
    depends_on:
      elastic:
        condition: service_started
      web:
        condition: service_started
    restart: unless-stopped
    stop_grace_period: 30s
    stop_signal: SIGTERM
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health/live/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ──────────────────────────────────────────
  # Celery worker  (background tasks)
  # ──────────────────────────────────────────
  celery:
    build: .
    profiles: [app]
    container_name: freelanceflow_celery
    command: >
      celery -A config worker
      -Q freelanceflow,freelanceflow_high_priority,freelanceflow_low_priority
      -l info
      --max-tasks-per-child=1000
    volumes:
      - media_data:/app/media
    env_file:
      - .env
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.production
      - PYTHONUNBUFFERED=1
      - ELASTICSEARCH_URL=http://elastic:9200
    networks:
      - freelanceflow_network
    depends_on:
      web:
        condition: service_started
    restart: unless-stopped
    stop_grace_period: 60s
    stop_signal: SIGTERM
    healthcheck:
      test: ["CMD-SHELL", "celery -A config inspect ping -t 5"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 40s

  # ──────────────────────────────────────────
  # Celery Beat  (periodic task scheduler)
  # ──────────────────────────────────────────
  celery-beat:
    build: .
    profiles: [app]
    container_name: freelanceflow_celery_beat
    command: >
      celery -A config beat
      -l info
      --scheduler django_celery_beat.schedulers:DatabaseScheduler
    env_file:
      - .env
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.production
      - PYTHONUNBUFFERED=1
    networks:
      - freelanceflow_network
    depends_on:
      web:
        condition: service_started
    restart: unless-stopped
    stop_grace_period: 30s
    stop_signal: SIGTERM
    healthcheck:
      disable: true

  # ──────────────────────────────────────────
  # Flower  (Celery monitoring UI → :5555)
  # ──────────────────────────────────────────
  flower:
    build: .
    profiles: [app]
    container_name: freelanceflow_flower
    command: celery -A config flower --port=5555
    ports:
      - "5555:5555"
    env_file:
      - .env
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.production
      - PYTHONUNBUFFERED=1
    networks:
      - freelanceflow_network
    depends_on:
      celery:
        condition: service_started
    restart: unless-stopped
    stop_grace_period: 20s
    stop_signal: SIGTERM
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5555/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    
  # ──────────────────────────────────────────
  # Caddy (HTTPS & Reverse Proxy)
  # ──────────────────────────────────────────
  caddy:
    image: caddy:latest
    profiles: [app]
    container_name: freelanceflow_caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      # Using a volume directly from the built web image is tricky, 
      # but media files are shared. Caddy will proxy static requests 
      # to Django unless static files are explicitly shared via volume.
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - freelanceflow_network
    depends_on:
      web:
        condition: service_healthy

# ──────────────────────────────────────────
# Shared network
# ──────────────────────────────────────────
networks:
  freelanceflow_network:
    driver: bridge

# ──────────────────────────────────────────
# Named volumes
# ──────────────────────────────────────────
volumes:
  elastic_data:
    driver: local
  media_data:
    driver: local
  caddy_data:
    driver: local
  caddy_config:
    driver: local
