# ============================================
# FreelanceFlow — docker-compose.yml
# ============================================
# Profiles:
#   (none)   — Infrastructure only: Redis + Elasticsearch
#   app      — Full stack: infra + Django + Celery + Daphne + Flower
#
# ── Step 1: Start infrastructure only ──
#   docker compose up -d
#   → Starts Redis (localhost:6379) + Elasticsearch (localhost:9200)
#   → Then run your Django app locally:
#       python manage.py runserver
#       celery -A config worker -l info
#
# ── Step 4: Full Dockerized stack ──
#   docker compose --profile app up --build -d
#   → Starts everything including the Django app
#
# Other useful commands:
#   docker compose logs -f redis             # tail Redis logs
#   docker compose exec elastic curl localhost:9200/_cluster/health
#   docker compose down                      # stop + remove containers
#   docker compose down -v                   # also wipe volumes
# ============================================

services:

  # ──────────────────────────────────────────
  # Redis 7  (broker + result backend + cache + channel layer)
  # ──────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: freelanceflow_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: >
      redis-server
        --save 60 1
        --loglevel warning
        --maxmemory 256mb
        --maxmemory-policy allkeys-lru
    networks:
      - freelanceflow_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ──────────────────────────────────────────
  # Elasticsearch  (search engine — local)
  # ──────────────────────────────────────────
  elastic:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.14.0
    container_name: freelanceflow_elasticsearch
    environment:
      - node.name=es-node-01
      - cluster.name=freelanceflow-cluster
      - discovery.type=single-node
      - xpack.security.enabled=false
      - xpack.security.enrollment.enabled=false
      - xpack.security.http.ssl.enabled=false
      - xpack.security.transport.ssl.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    ports:
      - "9200:9200"
    volumes:
      - elastic_data:/usr/share/elasticsearch/data
    networks:
      - freelanceflow_network
    restart: unless-stopped
    healthcheck:
      test:
        - "CMD-SHELL"
        - "curl -sf http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s || exit 1"
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 60s

  # ──────────────────────────────────────────
  # Django dev server  (hot-reload via volume)
  # ──────────────────────────────────────────
  web:
    build: .
    profiles: [app]
    container_name: freelanceflow_web
    command: python manage.py runserver 0.0.0.0:8000
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - /app/venv
    env_file:
      - .env
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.local
      - PYTHONUNBUFFERED=1
      # Redis — Docker container (overrides any Upstash URL in .env)
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
      # Elasticsearch — Docker container
      - ELASTICSEARCH_URL=http://elastic:9200
    networks:
      - freelanceflow_network
    depends_on:
      redis:
        condition: service_healthy
      elastic:
        condition: service_started
    restart: unless-stopped
    stop_grace_period: 30s
    stop_signal: SIGTERM
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/live/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ──────────────────────────────────────────
  # Daphne  (WebSocket / ASGI server)
  # ──────────────────────────────────────────
  daphne:
    build: .
    profiles: [app]
    container_name: freelanceflow_daphne
    command: daphne -b 0.0.0.0 -p 8001 config.asgi:application
    ports:
      - "8001:8001"
    volumes:
      - .:/app
      - /app/venv
    env_file:
      - .env
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.local
      - PYTHONUNBUFFERED=1
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
      - ELASTICSEARCH_URL=http://elastic:9200
    networks:
      - freelanceflow_network
    depends_on:
      redis:
        condition: service_healthy
      elastic:
        condition: service_started
      web:
        condition: service_started
    restart: unless-stopped
    stop_grace_period: 30s
    stop_signal: SIGTERM

  # ──────────────────────────────────────────
  # Celery worker  (background tasks)
  # ──────────────────────────────────────────
  celery:
    build: .
    profiles: [app]
    container_name: freelanceflow_celery
    command: >
      celery -A config worker
      -Q freelanceflow,freelanceflow_high_priority,freelanceflow_low_priority
      -l info
      --max-tasks-per-child=1000
    volumes:
      - .:/app
      - /app/venv
    env_file:
      - .env
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.local
      - PYTHONUNBUFFERED=1
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
      - ELASTICSEARCH_URL=http://elastic:9200
    networks:
      - freelanceflow_network
    depends_on:
      redis:
        condition: service_healthy
      web:
        condition: service_started
    restart: unless-stopped
    stop_grace_period: 60s
    stop_signal: SIGTERM
    healthcheck:
      test: ["CMD-SHELL", "celery -A config inspect ping -t 5"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 40s

  # ──────────────────────────────────────────
  # Celery Beat  (periodic task scheduler)
  # ──────────────────────────────────────────
  celery-beat:
    build: .
    profiles: [app]
    container_name: freelanceflow_celery_beat
    command: >
      celery -A config beat
      -l info
      --scheduler django_celery_beat.schedulers:DatabaseScheduler
    volumes:
      - .:/app
      - /app/venv
    env_file:
      - .env
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.local
      - PYTHONUNBUFFERED=1
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
    networks:
      - freelanceflow_network
    depends_on:
      redis:
        condition: service_healthy
      web:
        condition: service_started
    restart: unless-stopped
    stop_grace_period: 30s
    stop_signal: SIGTERM

  # ──────────────────────────────────────────
  # Flower  (Celery monitoring UI → :5555)
  # ──────────────────────────────────────────
  flower:
    build: .
    profiles: [app]
    container_name: freelanceflow_flower
    command: celery -A config flower --port=5555
    ports:
      - "5555:5555"
    volumes:
      - .:/app
      - /app/venv
    env_file:
      - .env
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.local
      - PYTHONUNBUFFERED=1
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
    networks:
      - freelanceflow_network
    depends_on:
      redis:
        condition: service_healthy
      celery:
        condition: service_started
    restart: unless-stopped
    stop_grace_period: 20s
    stop_signal: SIGTERM

# ──────────────────────────────────────────
# Shared network
# ──────────────────────────────────────────
networks:
  freelanceflow_network:
    driver: bridge

# ──────────────────────────────────────────
# Named volumes
# ──────────────────────────────────────────
volumes:
  redis_data:
    driver: local
  elastic_data:
    driver: local
