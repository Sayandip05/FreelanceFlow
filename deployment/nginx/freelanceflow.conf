# FreelanceFlow Nginx Configuration — Essential Only

# Rate limiting
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=100r/m;
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/m;

# Upstream servers
upstream django_backend {
    server web:8000;
    keepalive 32;
}

upstream daphne_websocket {
    server daphne:8001;
    keepalive 16;
}

# HTTP → HTTPS redirect
server {
    listen 80;
    server_name freelanceflow.com www.freelanceflow.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://freelanceflow.com$request_uri;
    }
}

# HTTPS server
server {
    listen 443 ssl http2;
    server_name freelanceflow.com www.freelanceflow.com;

    # SSL
    ssl_certificate /etc/letsencrypt/live/freelanceflow.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/freelanceflow.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;

    # Logging
    access_log /var/log/nginx/freelanceflow_access.log;
    error_log  /var/log/nginx/freelanceflow_error.log warn;

    # Request limits
    client_max_body_size 20M;
    keepalive_timeout 65s;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript;

    root /var/www/freelanceflow;

    # Health check
    location /health/ {
        access_log off;
        proxy_pass http://django_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Auth endpoints — strict rate limit
    location ~ ^/api/users/(login|register|password-reset)/ {
        limit_req zone=auth_limit burst=3 nodelay;
        proxy_pass http://django_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API
    location /api/ {
        limit_req zone=api_limit burst=20 nodelay;
        proxy_pass http://django_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Admin
    location /admin/ {
        proxy_pass http://django_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSocket (Django Channels)
    location /ws/ {
        proxy_pass http://daphne_websocket;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 7d;
        proxy_buffering off;
    }

    # Static files
    location /static/ {
        alias /var/www/freelanceflow/staticfiles/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Media files
    location /media/ {
        alias /var/www/freelanceflow/media/;
        expires 30d;
        access_log off;
        # Block executable file access
        location ~ \.(php|py|sh)$ { deny all; }
    }

    # Block hidden files (.env, .git, etc.)
    location ~ /\. {
        deny all;
    }

    # Frontend (React SPA)
    location / {
        try_files $uri $uri/ /index.html;
        expires 1h;
        add_header Cache-Control "public, must-revalidate";
    }
}
